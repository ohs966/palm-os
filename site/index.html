<!doctype html>
<html lang="en">
<head>
<title>Palm General Supply | Industrial and business supplies in Egypt</title>
<meta name="description" content="Fasteners, safety and PPE, cleaning, electrical, lighting, tools, uniforms and hotel supplies. Build a list and get a full quotation within 24 hours, anywhere in Egypt." />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=16" />
<link rel="icon" href="img/emblem-dark.png" />
<script src="icons.js?v=16"></script>
<script src="site.js?v=16"></script>
</head>
<body>

<main id="main">
  <section class="hero"><div class="wrap hero-in">
    <div class="hero-copy"><h1 data-t="hero_t"></h1><p data-t="hero_p"></p>
      <form class="hero-search" action="catalog.html"><input name="q" type="search" data-t-ph="search_ph" aria-label="Search" /><button class="btn light" type="submit" data-t="search_btn"></button></form></div>
    <dl class="hero-kpis" id="kpis"></dl>
  </div></section>
  <section class="wrap sec"><div class="sec-head"><h2 data-t="shop_by"></h2><a href="catalog.html" class="more"><span data-t="shop_all"></span> ›</a></div><div class="tiles" id="tiles"><div class="empty" data-t="loading"></div></div></section>
  <section class="how"><div class="wrap"><h2 data-t="how_t"></h2><ol class="steps"><li><b data-t="how1t"></b><span data-t="how1p"></span></li><li><b data-t="how2t"></b><span data-t="how2p"></span></li><li><b data-t="how3t"></b><span data-t="how3p"></span></li></ol></div></section>
  <section class="sec partners"><div class="wrap"><h2 data-t="partners"></h2><div class="plogos" id="plogos"></div></div></section>
</main>
<script>
window.PAGE = async function () {
  document.getElementById("plogos").innerHTML = PALM.partners.map((p) => '<img src="' + p + '" alt="" loading="lazy" />').join("");
  let deps = []; try { deps = await Site.departments(); } catch (e) {}
  const draw = () => {
    const total = deps.reduce((n, d) => n + Number(d.product_count || 0), 0);
    document.getElementById("kpis").innerHTML = '<div><dt>' + Site.t("hero_k1") + '</dt><dd>' + Site.num(total) + '+</dd></div><div><dt>' + Site.t("hero_k2") + '</dt><dd>' + Site.num(deps.length) + '</dd></div><div><dt>' + Site.t("hero_k3") + '</dt><dd>' + Site.t("hero_k3v") + '</dd></div>';
    document.getElementById("tiles").innerHTML = deps.map((d) => '<a class="tile" href="catalog.html?d=' + d.code + '"><span class="tile-ico">' + icon(d.icon || "box", 64) + '</span><span class="tile-name">' + Site.esc(Site.pick(d, "name")) + '</span><span class="tile-n">' + (d.product_count ? Site.num(d.product_count) + " " + Site.t("products") : Site.t("on_request")) + '</span></a>').join("");
  };
  draw(); document.addEventListener("langchange", draw);
};
</script>
</body>
</html>
