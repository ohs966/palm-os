<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Product | Palm Trade</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="wrap">
  <div class="page">
    <div class="top">
      <a class="brand" href="index.html"><span class="mark">P</span>Palm Trade</a>
      <nav class="nav">
        <a href="index.html" data-t="nav_home">Home</a>
        <a class="on" href="collections.html" data-t="nav_collections">Collections</a>
        <a href="index.html#about" data-t="nav_about">About</a>
        <a href="index.html#contact" data-t="nav_contact">Contact</a>
      </nav>
      <div class="icons"><button class="ibtn" data-lang-toggle><span data-t="lang" style="font-size:11px;font-weight:600">العربية</span></button></div>
    </div>
    <div class="crumbs" id="crumbs"><a href="index.html" data-t="nav_home">Home</a> / <a href="collections.html" data-t="nav_collections">Collections</a></div>
    <div id="body"><div class="empty" data-t="loading">Loading...</div></div>
  </div>
  <footer><span data-t="footer">Palm Trade. General supply company, Egypt.</span></footer>
</div>
<script src="site.js"></script>
<script>
let p = null;
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function render() {
  if (!p) return;
  document.title = `${Site.pick(p, "name")} | Palm Trade`;
  const img = Site.productImage(p);
  document.getElementById("body").innerHTML = `
    <div class="product">
      <div class="pic" style="background-image:url('${esc(img || "hero.jpg")}')"></div>
      <div>
        <div class="meta">${esc(Site.pick(p, "sector"))}${p.category_id ? " / " + esc(Site.pick(p, "category")) : ""}</div>
        <h1>${esc(Site.pick(p, "name"))}</h1>
        <div class="meta">${esc(Site.t("unit"))}: ${esc(p.unit)}</div>
        <div class="desc">${esc(Site.pick(p, "description"))}</div>
        <p style="margin-top:26px"><a class="cta" href="${esc(Site.quoteLink(p))}"><span>${esc(Site.t("product_cta"))}</span><span class="arr"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg></span></a></p>
        <p><a class="link2" href="collections.html">${esc(Site.t("back"))}</a></p>
      </div>
    </div>`;
}
document.addEventListener("langchange", render);
const id = new URLSearchParams(location.search).get("id");
Site.product(id).then((r) => { p = r; if (!p) throw new Error("not found"); render(); }).catch((e) => { document.getElementById("body").innerHTML = `<div class="empty">${esc(Site.t("error"))}<br><small>${esc(e.message)}</small></div>`; });
</script>
</body>
</html>
