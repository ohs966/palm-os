<!doctype html>
<html lang="en">
<head>
<title>Request a quotation | Palm General Supply</title>
<meta name="description" content="Send your list of supplies and receive an itemised quotation from Palm General Supply within 24 hours." />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=17" />
<link rel="icon" href="img/emblem-dark.png" />
<script src="icons.js?v=17"></script>
<script src="pages.js?v=17"></script>
<script src="posts.js?v=17"></script>
<script src="site.js?v=17"></script>
</head>
<body>

<main id="main" class="wrap quote-page">
  <div id="crumbs"></div>
  <h1 data-t="q_title"></h1><p class="muted" data-t="q_p"></p>
  <div class="q-layout">
    <section class="q-list"><h2 data-t="q_items"></h2><div id="items"></div>
      <div class="other" id="other"><label for="otherin" class="fh" data-t="other_item"></label><div class="row"><input id="otherin" data-t-ph="other_ph" /><button class="btn sm" id="otheradd" data-t="add"></button></div></div>
    </section>
    <section class="q-form"><form id="qform" class="form">
      <label><span data-t="fm_company"></span><input name="company" autocomplete="organization" /></label>
      <label><span data-t="fm_name"></span><input name="name" required autocomplete="name" /></label>
      <label><span data-t="fm_phone"></span><input name="phone" required dir="ltr" inputmode="tel" autocomplete="tel" /></label>
      <label><span data-t="fm_email"></span><input name="email" type="email" dir="ltr" autocomplete="email" /></label>
      <label><span data-t="fm_notes"></span><textarea name="notes" rows="3"></textarea></label>
      <button class="btn dark big" type="submit" data-t="fm_send"></button>
      <div id="msg" class="msg" role="status" hidden></div>
    </form>
    <div class="contact" id="contact"></div></section>
  </div>
</main>
<script>
window.PAGE = function () {
  const wa = PALM.phone.replace(/[^\d]/g, "");
  const draw = () => {
    document.getElementById("crumbs").innerHTML = Site.crumbs([{ label: Site.t("q_title") }]);
    const l = Site.list();
    document.getElementById("items").innerHTML = l.length ? '<ul class="qitems">' + l.map((x, i) => '<li><span class="qi-ico">' + icon(x.icon || "box", 36) + '</span><div class="qi-main"><b>' + Site.esc(Site.lang === "ar" ? x.name_ar : x.name_en) + '</b><small>' + Site.esc(Site.lang === "ar" ? x.opts_text_ar : x.opts_text_en) + '</small></div><input type="number" min="1" value="' + x.qty + '" data-i="' + i + '" aria-label="' + Site.t("qty") + '" /><span class="qi-unit">' + Site.esc(Site.unit(x.unit)) + '</span><button class="btn sm ghost" data-rm="' + i + '" aria-label="' + Site.t("remove") + '">\u2715</button></li>').join("") + '</ul>'
      : '<div class="empty">' + Site.t("q_empty") + ' <a href="catalog.html">' + Site.t("q_browse") + '</a></div>';
    document.querySelectorAll("[data-i]").forEach((inp) => inp.onchange = () => { const l2 = Site.list(); l2[inp.dataset.i].qty = Math.max(1, parseInt(inp.value || "1", 10)); Site.saveList(l2); });
    document.querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => { const l2 = Site.list(); l2.splice(Number(b.dataset.rm), 1); Site.saveList(l2); draw(); });
    document.getElementById("contact").innerHTML = '<div class="crow"><span>' + Site.t("c_call") + '</span><b dir="ltr">' + PALM.phone + '</b></div><a class="crow wa" href="https://wa.me/' + wa + '"><span>' + Site.t("c_wa") + '</span><b dir="ltr">' + PALM.phone + '</b></a><div class="crow"><span>' + Site.t("c_mail") + '</span><b>' + PALM.email + '</b></div>';
  };
  document.getElementById("otheradd").onclick = () => { const v = document.getElementById("otherin").value.trim(); if (!v) return; Site.addToList({ id: "custom-" + Date.now(), name_en: v, name_ar: v, unit: "", qty: 1, opts: [], opts_text_en: "", opts_text_ar: "", icon: "box" }); document.getElementById("otherin").value = ""; draw(); };
  document.getElementById("qform").addEventListener("submit", async (e) => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target).entries()); const msg = document.getElementById("msg"); const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
    try { await Site.submitRequest(f, Site.list()); msg.className = "msg ok"; msg.textContent = Site.t("fm_ok"); msg.hidden = false; e.target.reset(); Site.saveList([]); draw(); }
    catch (err) { msg.className = "msg bad"; msg.textContent = Site.t("fm_bad"); msg.hidden = false; }
    btn.disabled = false;
  });
  draw(); document.addEventListener("langchange", draw); document.addEventListener("listchange", () => {});
};
</script>
</body>
</html>
