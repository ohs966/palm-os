<!doctype html>
<html lang="en">
<head>
<title>We supply | Palm General Supply</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=15" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%238a3731%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 font-family=%27Arial%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3EP%3C/text%3E%3C/svg%3E" />
</head>
<body>
<section class="page-head"><div class="tags" id="htags"></div><h1 id="htitle"></h1><p id="hp"></p></section>
<div id="body"></div>
<script src="site.js?v=15"></script>
<script>
window.PAGE = function () {
  let rows = null; let opts = [];
  const code = () => new URLSearchParams(location.search).get("industry");
  const draw = () => {
    const c = code(); const ind = INDUSTRIES.find((x) => x.code === c); const body = document.getElementById("body");
    if (!ind) {
      document.getElementById("htags").innerHTML = ''; document.getElementById("htitle").textContent = Site.t("s_title"); document.getElementById("hp").textContent = Site.t("s_p"); document.title = Site.t("s_title") + " | Palm General Supply";
      body.innerHTML = '<div class="list">' + INDUSTRIES.map((x, i) => '<a class="ind" href="supply.html?industry=' + x.code + '"><div class="im" style="background-image:url(' + x.img + ')"></div><div><div class="n">0' + (i + 1) + '</div><h3>' + Site.esc(Site.i(x, 0) + " " + Site.i(x, 1)) + '</h3></div><span class="go"><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg></span></a>').join("") + '</div>';
      return;
    }
    const idx = INDUSTRIES.indexOf(ind);
    document.getElementById("htags").innerHTML = '<a class="pill" href="supply.html" style="color:#fff">' + Site.esc(Site.t("s_back")) + '</a><span class="pill" style="opacity:.6">0' + (idx + 1) + '</span>';
    document.getElementById("htitle").textContent = Site.i(ind, 0) + " " + Site.i(ind, 1); document.getElementById("hp").textContent = Site.i(ind, 2); document.title = Site.i(ind, 0) + " | Palm General Supply";
    const chips = '<div class="chips">' + INDUSTRIES.map((x) => '<a class="pill ' + (x.code === c ? "on" : "") + '" href="supply.html?industry=' + x.code + '">' + Site.esc(Site.i(x, 0)) + '</a>').join("") + '</div>';
    const cta = '<div class="sticky-cta"><a class="pill clay" href="quote.html?industry=' + c + '"><span>' + Site.esc(Site.t("nav_quote")) + '</span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg></a></div>';
    if (!rows) { body.innerHTML = chips + '<div class="shop"><div class="empty">' + Site.esc(Site.t("loading")) + '</div></div>' + cta; return; }
    const items = rows.filter((r) => ind.sector.includes(r.sector_code));
    body.innerHTML = chips + (items.length ? '<div class="shop">' + items.map((p) => Site.card(p, opts)).join("") + '</div>' : '<div class="products"><div class="empty">' + Site.esc(Site.t("s_none")) + '</div></div>') + cta;
  };
  draw(); document.addEventListener("langchange", draw);
  Site.catalogue().then(async (r) => { rows = r; draw(); if (r.length) { opts = await Site.options(r.map((x) => x.id)).catch(() => []); draw(); } }).catch(() => { rows = []; draw(); });
};
</script>
</body>
</html>
